  statement: |
    O time quer publicar a documentação da API para parceiros: dezenas de páginas em Markdown, com busca e navegação lateral, atualizadas a cada versão.

    Por que um gerador de site estático, como VuePress ou Eleventy, combina com isso?
  options:
    - text: Ele transforma os arquivos Markdown em HTML no build, com navegação e temas, e o resultado é servido como arquivos simples e rápidos
      why: Certo. Conteúdo que muda a cada versão, igual para todos, é o caso ideal de geração estática.
    - text: Ele exige um banco de dados para cada página
      why: O conteúdo vem dos arquivos do repositório, sem banco.
    - text: Ele só funciona com páginas sem texto
