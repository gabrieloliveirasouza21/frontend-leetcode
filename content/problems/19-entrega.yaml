- slug: ssr-em-streaming
  title: A página que chega em partes
  difficulty: dificil
  kind: quiz
  visual: renderizacao-servidor
  in: [ssr/Next.js, performance/Streamed Responses]
  study:
    - { label: "Streaming e Suspense (Next.js)", url: "https://nextjs.org/docs/app/api-reference/file-conventions/loading" }
    - { label: "Suspense (React)", url: "https://react.dev/reference/react/Suspense" }
  statement: |
    A página de uma banda renderiza no servidor. O cabeçalho e a biografia ficam prontos em 50ms, mas as avaliações dos fãs vêm de um serviço lento, que leva 2 segundos. Hoje a pessoa espera 2 segundos para ver qualquer coisa.

    Qual recurso do Next.js com React resolve?
  options:
    - text: Envolver as avaliações num `Suspense` com um fallback. O servidor envia o resto da página na hora, em streaming, e as avaliações chegam depois
      why: Certo. O HTML é enviado em partes, e o que é lento não segura o que já está pronto.
    - text: Mover a página toda para o cliente
      why: A pessoa veria uma página vazia até o JavaScript carregar e buscar os dados.
    - text: Aumentar o tempo limite do servidor
      why: Isso não muda o tempo que a pessoa espera.
    - text: Gerar a página no build com as avaliações
      why: As avaliações mudam o tempo todo e ficariam desatualizadas.
  answer: 0
  explanation: |
    Com streaming, o servidor manda o HTML em pedaços conforme cada parte fica pronta. `Suspense` marca as fronteiras: o fallback vai primeiro, e o conteúdo real é inserido quando chega. A primeira tela aparece cedo, e as partes lentas não bloqueiam o resto.

- slug: revalidar-pagina-estatica
  title: O line-up estático que muda às vezes
  difficulty: medio
  kind: quiz
  visual: renderizacao-servidor
  in: [ssg/Next.js]
  study:
    - { label: "Regeneração estática incremental (Next.js)", url: "https://nextjs.org/docs/app/guides/incremental-static-regeneration" }
  statement: |
    A página do line-up é gerada no build e muda algumas vezes por dia, quando a produção confirma uma banda. Fazer um build completo a cada mudança é lento.

    Qual recurso do Next.js resolve?
  options:
    - text: Regeneração estática incremental, com `revalidate`, que serve a página estática e a regenera ao fundo depois do intervalo, ou sob demanda
      why: Certo. A página continua rápida como estática e se atualiza sem um build completo.
    - text: Renderizar no servidor a cada pedido
      why: Funciona, mas gasta processamento a cada visita para uma página que muda poucas vezes por dia.
    - text: Desligar o cache do CDN
      why: Isso deixa tudo mais lento e não regenera a página.
    - text: Pedir às pessoas que recarreguem a página
      why: Recarregar não muda o arquivo gerado no build.
  answer: 0
  explanation: |
    A regeneração incremental mistura estático e dinâmico: a página é servida pronta, e o framework a regenera depois de um tempo ou quando você pede, por exemplo num webhook do CMS. Quem chega durante a regeneração ainda recebe a versão anterior, que logo é trocada.

- slug: dados-sem-buscar-duas-vezes
  title: O pedido que acontece duas vezes
  difficulty: medio
  kind: quiz
  in: [ssr/Nuxt.js]
  study:
    - { label: "Busca de dados (Nuxt)", url: "https://nuxt.com/docs/getting-started/data-fetching" }
  statement: |
    Numa página Nuxt renderizada no servidor, o line-up é buscado com `fetch` direto no `setup`. Os logs mostram dois pedidos por visita: um no servidor e outro no navegador, durante a hidratação.

    O que o Nuxt oferece para isso?
  options:
    - text: "`useFetch` ou `useAsyncData`, que buscam no servidor e enviam o resultado junto com a página, para o navegador reaproveitar sem buscar de novo"
      why: Certo. O resultado viaja no payload da página e o cliente hidrata com ele.
    - text: Buscar só no navegador, com `onMounted`
      why: Assim a página chega sem os dados, e o SSR perde o sentido.
    - text: Duplicar o código para o servidor e o cliente
      why: Isso mantém os dois pedidos.
    - text: Desligar a hidratação
      why: Sem hidratação, a página não fica interativa.
  answer: 0
  explanation: |
    Em SSR, o mesmo componente roda no servidor e no cliente. Os utilitários de dados dos frameworks serializam o que foi buscado no servidor e entregam ao cliente, evitando pedidos duplicados e diferenças de hidratação.

- slug: escolher-por-rota
  title: Estático aqui, servidor ali
  difficulty: medio
  kind: quiz
  visual: renderizacao-servidor
  in: [ssr/Astro, ssg/Astro]
  study:
    - { label: "Renderização sob demanda (Astro)", url: "https://docs.astro.build/en/guides/on-demand-rendering/" }
  statement: |
    No site em Astro, as páginas de notícias são estáticas, mas a página `minha-conta` mostra dados de quem está logado.

    Como o Astro trata isso?
  options:
    - text: Cada rota pode ser pré-renderizada no build ou renderizada sob demanda no servidor, com o adaptador e a opção `prerender` daquela página
      why: Certo. O Astro permite misturar páginas estáticas e dinâmicas no mesmo projeto.
    - text: O site inteiro precisa ser estático ou inteiro no servidor
      why: A escolha pode ser feita por página.
    - text: Basta usar JavaScript no cliente para buscar a conta
      why: Funciona para partes da página, mas não serve se a página precisa de dados do servidor antes de aparecer.
    - text: O Astro não permite páginas com login
      why: Permite, com renderização sob demanda num servidor ou em funções.
  answer: 0
  explanation: |
    Frameworks modernos escolhem a estratégia por rota: estático para o que é igual para todos, sob demanda para o que depende de quem pede. No Astro, isso exige um adaptador para a plataforma de deploy e a opção `prerender` em cada página.

- slug: previa-por-pull-request
  title: Ver a mudança antes de publicar
  difficulty: facil
  kind: quiz
  in: [deployment/Vercel, deployment/Netlify]
  study:
    - { label: "Deploys de prévia (Vercel)", url: "https://vercel.com/docs/deployments/environments#preview-environment-pre-production" }
    - { label: "Deploy previews (Netlify)", url: "https://docs.netlify.com/deploy/deploy-types/deploy-previews/" }
  statement: |
    A designer quer ver cada mudança no site funcionando antes de ela ir para produção, sem rodar nada na máquina dela.

    O que Vercel e Netlify oferecem?
  options:
    - text: Um deploy de prévia por pull request, com uma URL própria, que se atualiza a cada push no branch
      why: 'Certo. A revisão fica concreta: a pessoa abre o link e testa a mudança como ela vai ficar.'
    - text: Um botão que publica direto em produção
      why: Isso publica sem revisão, que é o oposto do pedido.
    - text: Um servidor de desenvolvimento local
      why: Exige que a designer rode o projeto na máquina dela.
    - text: Screenshots automáticos do código
      why: Uma imagem não mostra interações nem comportamento.
  answer: 0
  explanation: |
    Plataformas de deploy criam um ambiente para cada branch ou pull request, com URL única. A revisão de produto e design acontece junto com a de código. Cuidado com variáveis de ambiente das prévias: use credenciais de teste, não as de produção.

- slug: funcao-na-borda
  title: Redirecionar pelo país
  difficulty: medio
  kind: quiz
  in: [deployment/Cloudflare]
  study:
    - { label: "Cloudflare Workers", url: "https://developers.cloudflare.com/workers/" }
  statement: |
    O site deve mandar quem acessa de Portugal para a versão `/pt-pt` e o resto do mundo para `/pt-br`, com o menor atraso possível.

    Por que uma função na borda, como um Cloudflare Worker, combina com isso?
  options:
    - text: Ela roda em servidores perto de cada visitante, antes do pedido chegar à origem, e pode responder com um redirecionamento na hora
      why: Certo. Lógicas pequenas e rápidas, como redirecionamentos e cabeçalhos, ganham com a proximidade.
    - text: Ela roda no navegador da pessoa
      why: Funções na borda rodam nos servidores da rede, não no navegador.
    - text: Ela substitui o banco de dados
      why: Funções na borda são código, não armazenamento. Elas têm limites de tempo e recursos.
    - text: Ela só funciona com sites estáticos
      why: Ela pode ficar na frente de qualquer origem, estática ou dinâmica.
  answer: 0
  explanation: |
    Plataformas de borda executam código nos pontos de presença da CDN, a poucos milissegundos de cada usuário. Servem para redirecionamentos, autenticação leve, testes A/B e personalização simples. Para trabalho pesado ou que depende de um banco central, a latência até o banco pode anular o ganho.

- slug: documentacao-estatica
